<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F3 · Inventario — Esthetic POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap">
<style>
:root {
  --surface:            #FFFFFF;
  --surface-container:  #F4F4F5;
  --surface-variant:    #E8EAED;
  --on-surface:         #18181B;
  --on-surface-muted:   #71717A;
  --outline:            #D4D4D8;
  --primary:            #0369A1;
  --on-primary:         #FFFFFF;
  --primary-container:  #E0F2FE;
  --secondary:          #0F766E;
  --secondary-container:#CCFBF1;
  --error:              #DC2626;
  --error-container:    #FEE2E2;
  --warning:            #D97706;
  --warning-container:  #FEF3C7;
  --success:            #16A34A;
  --success-container:  #DCFCE7;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
  --font:'Segoe UI','Inter',system-ui,sans-serif;
  --font-mono:'Consolas','Courier New',monospace;
  --topbar-h:48px;--funcbar-h:44px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--surface);color:var(--on-surface);font-size:13px;line-height:1.4;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── TopBar ── */
.topbar{height:var(--topbar-h);min-height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--outline);display:flex;align-items:center;padding:0 var(--s6);position:relative;}
.topbar-left{display:flex;align-items:center;gap:var(--s2);}
.app-icon{width:20px;height:20px;background:var(--primary);border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:700;}
.app-name{font-size:13px;font-weight:500;}
.topbar-center{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--s4);}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary-container);color:var(--primary);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;}
.clock{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--on-surface-muted);}

/* ── FunctionBar ── */
.funcbar{height:var(--funcbar-h);min-height:var(--funcbar-h);background:var(--surface-container);border-top:1px solid var(--outline);display:flex;align-items:stretch;padding:0 var(--s6);}
.funcbar-item{display:flex;align-items:center;gap:var(--s1);padding:0 var(--s3);cursor:pointer;border-bottom:2px solid transparent;text-decoration:none;transition:background 120ms;}
.funcbar-item:hover{background:var(--surface-variant);}
.funcbar-item.active{border-bottom-color:var(--primary);}
.funcbar-item.active .fkey,.funcbar-item.active .flabel{color:var(--primary);}
.funcbar-item.active .flabel{font-weight:500;}
.funcbar-sep{width:1px;background:var(--outline);margin:12px 0;}
.fkey{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--primary);}
.fdot{font-size:11px;color:var(--outline);}
.flabel{font-size:13px;color:var(--on-surface);}

/* ── Content ── */
.content{flex:1;display:flex;gap:var(--s4);padding:var(--s4);overflow:hidden;background:var(--surface-container);}

/* ── Card ── */
.card{background:var(--surface);border:1px solid var(--outline);border-radius:6px;}

/* ── Buttons ── */
.btn{height:36px;border-radius:4px;font-size:13px;font-weight:600;font-family:var(--font);padding:0 var(--s4);cursor:pointer;border:none;display:inline-flex;align-items:center;gap:var(--s1);transition:background 120ms;white-space:nowrap;flex-shrink:0;}
.btn-primary{background:var(--primary);color:var(--on-primary);}
.btn-primary:hover{background:#075985;}
.btn-success{background:var(--success);color:#fff;}
.btn-success:hover{background:#15803d;}
.btn-warning{background:var(--warning);color:#fff;}
.btn-warning:hover{background:#b45309;}
.btn-ghost{background:transparent;color:var(--primary);border:none;}
.btn-ghost:hover{background:var(--primary-container);}
.btn-full{width:100%;justify-content:center;}
.btn-icon{width:32px;height:32px;padding:0;background:transparent;border:none;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--on-surface-muted);}
.btn-icon:hover{background:var(--surface-variant);}
.btn-icon .material-symbols-outlined,.btn .material-symbols-outlined{font-size:16px;}

/* ── Inputs ── */
.input,.select,.textarea{width:100%;height:36px;border:1px solid var(--outline);border-radius:4px;padding:0 var(--s3);font-size:13px;font-family:var(--font);color:var(--on-surface);background:var(--surface);outline:none;}
.input:focus,.select:focus,.textarea:focus{border:2px solid var(--primary);}
.textarea{height:72px;padding:var(--s2) var(--s3);resize:none;}
.select{appearance:none;cursor:pointer;}
.input-wrap{position:relative;}
.input-wrap .material-symbols-outlined{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--on-surface-muted);pointer-events:none;}
.input-wrap .input{padding-left:34px;}
.field-label{font-size:11px;font-weight:500;color:var(--on-surface-muted);display:block;margin-bottom:var(--s1);}
.field-group{display:flex;flex-direction:column;gap:var(--s1);}
.select-wrap{position:relative;}
.select-wrap::after{content:'expand_more';font-family:'Material Symbols Outlined';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--on-surface-muted);pointer-events:none;}

/* ── Chip ── */
.chip{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:3px;font-size:11px;font-weight:500;white-space:nowrap;}
.chip-success{background:var(--success-container);color:var(--success);}
.chip-warning{background:var(--warning-container);color:var(--warning);}
.chip-error{background:var(--error-container);color:var(--error);}
.chip-primary{background:var(--primary-container);color:var(--primary);}
.chip-neutral{background:var(--surface-variant);color:var(--on-surface-muted);}

/* ── DataGrid ── */
.dg{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
.dg-head{display:flex;align-items:center;height:34px;background:var(--surface-container);border-bottom:1px solid var(--outline);padding:0 var(--s3);flex-shrink:0;}
.dg-th{font-size:11px;font-weight:500;color:var(--on-surface-muted);text-transform:uppercase;letter-spacing:.04em;padding:0 var(--s2);}
.dg-th.sort{cursor:pointer;display:flex;align-items:center;gap:2px;}
.dg-th.sort:hover{color:var(--on-surface);}
.dg-body{flex:1;overflow-y:auto;}
.dg-row{display:flex;align-items:center;min-height:40px;padding:4px var(--s3);border-bottom:1px solid var(--outline);cursor:pointer;transition:background 100ms;position:relative;}
.dg-row:hover{background:var(--primary-container);}
.dg-row.selected{background:var(--primary-container);outline:2px solid var(--primary);outline-offset:-2px;}
.dg-row.alt{background:var(--surface-container);}
.dg-row.alt:hover{background:var(--primary-container);}
.dg-row:hover .row-actions{opacity:1;}
.dg-cell{font-size:13px;color:var(--on-surface);padding:0 var(--s2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dg-cell.muted{color:var(--on-surface-muted);font-size:11px;}
.dg-cell.mono{font-family:var(--font-mono);}
.row-actions{display:flex;gap:2px;opacity:0;transition:opacity 120ms;margin-left:auto;flex-shrink:0;}

/* ── Stock bar ── */
.stock-bar-wrap{display:flex;align-items:center;gap:var(--s2);flex:1;min-width:0;}
.stock-bar{height:4px;border-radius:2px;background:var(--surface-variant);flex:1;overflow:hidden;}
.stock-bar-fill{height:100%;border-radius:2px;transition:width 300ms;}

/* ── Alert banner ── */
.alert{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);border-radius:4px;font-size:12px;font-weight:500;}
.alert-warning{background:var(--warning-container);color:var(--warning);border:1px solid #fbbf24;}
.alert-error{background:var(--error-container);color:var(--error);border:1px solid #fca5a5;}
.alert .material-symbols-outlined{font-size:16px;flex-shrink:0;}

/* ── Numpad delta ── */
.delta-input{width:100%;height:56px;border:2px solid var(--outline);border-radius:6px;font-size:28px;font-weight:700;font-family:var(--font-mono);text-align:center;color:var(--on-surface);background:var(--surface);outline:none;cursor:default;}
.delta-input:focus{border-color:var(--primary);}
.delta-display{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);}
.delta-sign{font-size:28px;font-weight:700;font-family:var(--font-mono);width:40px;text-align:center;border:2px solid var(--outline);border-radius:6px;height:56px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 120ms;flex-shrink:0;}
.delta-sign.positive{color:var(--success);border-color:var(--success);background:var(--success-container);}
.delta-sign.negative{color:var(--error);border-color:var(--error);background:var(--error-container);}

/* ── Movement row ── */
.mv-row{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);border-bottom:1px solid var(--outline);}
.mv-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mv-icon .material-symbols-outlined{font-size:16px;}
.mv-icon.entrada{background:var(--success-container);color:var(--success);}
.mv-icon.salida{background:var(--error-container);color:var(--error);}
.mv-icon.ajuste{background:var(--primary-container);color:var(--primary);}
.mv-info{flex:1;min-width:0;}
.mv-prod{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mv-meta{font-size:11px;color:var(--on-surface-muted);}
.mv-delta{font-size:13px;font-weight:700;font-family:var(--font-mono);flex-shrink:0;width:52px;text-align:right;}
.mv-delta.pos{color:var(--success);}
.mv-delta.neg{color:var(--error);}

/* ── Section header ── */
.section-header{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--outline);flex-shrink:0;}
.section-title{font-size:13px;font-weight:600;flex:1;}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--outline);flex-shrink:0;}

/* ── KPI cards ── */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);padding:var(--s3) var(--s4);flex-shrink:0;}
.kpi{background:var(--surface-container);border-radius:4px;padding:var(--s2) var(--s3);}
.kpi-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--on-surface-muted);}
.kpi-val{font-size:18px;font-weight:700;font-family:var(--font-mono);}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--outline);border-radius:2px;}

.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;user-select:none;}
</style>
</head>
<body>

<!-- TopBar -->
<header class="topbar">
  <div class="topbar-left">
    <div class="app-icon">PS</div>
    <span class="app-name">Esthetic POS</span>
  </div>
  <div class="topbar-center">Inventario</div>
  <div class="topbar-right">
    <div class="avatar">AD</div>
    <span class="clock" id="clock">14:32</span>
  </div>
</header>

<!-- ════ CONTENT ════ -->
<div class="content">

  <!-- ════ COLUMNA IZQUIERDA: Stock ════ -->
  <div style="width:52%;display:flex;flex-direction:column;gap:var(--s3);overflow:hidden;">

    <!-- KPI rápidos -->
    <div class="card" style="display:flex;flex-direction:column;">
      <div class="kpi-row">
        <div class="kpi">
          <div class="kpi-label">Total SKUs</div>
          <div class="kpi-val" style="color:var(--on-surface);">142</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Stock bajo</div>
          <div class="kpi-val" style="color:var(--warning);">8</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Sin stock</div>
          <div class="kpi-val" style="color:var(--error);">3</div>
        </div>
      </div>
    </div>

    <!-- Stock DataGrid -->
    <div class="card" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <!-- Toolbar -->
      <div class="toolbar">
        <div class="input-wrap" style="flex:1;">
          <span class="material-symbols-outlined">search</span>
          <input class="input" type="text" placeholder="Buscar producto..." id="inv-search" oninput="filterInv()">
        </div>
        <div class="select-wrap" style="width:140px;">
          <select class="select" id="filter-status" onchange="filterInv()">
            <option value="">Todos</option>
            <option value="ok">En stock</option>
            <option value="low">Stock bajo</option>
            <option value="out">Sin stock</option>
          </select>
        </div>
        <button class="btn btn-ghost" onclick="exportCsv()" title="Exportar CSV">
          <span class="material-symbols-outlined">download</span>
        </button>
      </div>

      <!-- Grid -->
      <div class="dg">
        <div class="dg-head">
          <div class="dg-th" style="flex:1;">Producto</div>
          <div class="dg-th" style="width:100px;">Stock</div>
          <div class="dg-th" style="width:90px;">Estado</div>
          <div class="dg-th" style="width:40px;"></div>
        </div>
        <div class="dg-body" id="inv-list">
          <!-- rendered by JS -->
        </div>
      </div>
    </div>

  </div>

  <!-- ════ COLUMNA DERECHA ════ -->
  <div style="flex:1;display:flex;flex-direction:column;gap:var(--s3);overflow:hidden;">

    <!-- Panel de ajuste -->
    <div class="card" style="flex-shrink:0;">
      <div class="section-header">
        <span class="material-symbols-outlined" style="color:var(--primary);">tune</span>
        <span class="section-title">Ajuste de stock</span>
        <span class="chip chip-neutral" id="adj-product-chip">Selecciona un producto</span>
      </div>

      <div style="padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);">

        <!-- Selector de producto (si no viene del grid) -->
        <div class="field-group">
          <label class="field-label">Producto</label>
          <div class="select-wrap">
            <select class="select" id="adj-product" onchange="onAdjProductChange()">
              <option value="">Selecciona un producto</option>
              <option value="1">Ibuprofeno 400mg · Caja x10  (stock: 48)</option>
              <option value="2">Crema Cicatrizante 50g  (stock: 4)</option>
              <option value="3">Guantes Latex M x100  (stock: 22)</option>
              <option value="4">Suero Fisiológico 500ml  (stock: 0)</option>
              <option value="5">Bisturí Desechable #22  (stock: 150)</option>
            </select>
          </div>
        </div>

        <!-- Delta: signo + cantidad -->
        <div class="field-group">
          <label class="field-label">Cantidad</label>
          <div class="delta-display">
            <div class="delta-sign positive" id="delta-sign" onclick="toggleSign()" title="Click para cambiar a negativo">+</div>
            <input class="delta-input" type="number" id="delta-qty" value="1" min="1" oninput="updateAdjPreview()">
          </div>
          <!-- Preview resultado -->
          <div id="adj-preview" style="display:none;font-size:12px;color:var(--on-surface-muted);text-align:center;">
            Stock actual: <strong id="adj-current">—</strong> → Nuevo stock: <strong id="adj-new" style="color:var(--primary);">—</strong>
          </div>
        </div>

        <!-- Motivo -->
        <div class="field-group">
          <label class="field-label">Motivo *</label>
          <div class="select-wrap">
            <select class="select" id="adj-reason">
              <option value="">Selecciona un motivo</option>
              <option value="conteo">Conteo físico</option>
              <option value="dano">Producto dañado</option>
              <option value="devolucion">Devolución de compra</option>
              <option value="muestra">Muestra / uso interno</option>
              <option value="otro">Otro</option>
            </select>
          </div>
        </div>

        <!-- Nota libre -->
        <div class="field-group">
          <label class="field-label">Nota (opcional)</label>
          <textarea class="textarea" id="adj-note" placeholder="Detalle del ajuste..."></textarea>
        </div>

        <!-- CTA -->
        <div style="display:flex;gap:var(--s2);">
          <button class="btn btn-success btn-full" onclick="applyAdj()" style="flex:2;">
            <span class="material-symbols-outlined">check_circle</span>
            Aplicar ajuste
          </button>
          <button class="btn btn-ghost" onclick="clearAdj()">
            <span class="material-symbols-outlined">clear</span>
            Limpiar
          </button>
        </div>
      </div>
    </div>

    <!-- Historial de movimientos -->
    <div class="card" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <div class="section-header">
        <span class="material-symbols-outlined" style="color:var(--on-surface-muted);">history</span>
        <span class="section-title">Historial de movimientos</span>
        <div style="display:flex;gap:var(--s2);">
          <div class="select-wrap" style="width:130px;">
            <select class="select" style="height:28px;font-size:11px;" id="mv-filter">
              <option value="">Todo tipo</option>
              <option value="entrada">Entradas</option>
              <option value="salida">Salidas</option>
              <option value="ajuste">Ajustes</option>
            </select>
          </div>
        </div>
      </div>
      <div style="flex:1;overflow-y:auto;" id="mv-list">
        <!-- rendered by JS -->
      </div>
    </div>

  </div>
</div>

<!-- FunctionBar -->
<nav class="funcbar">
  <a class="funcbar-item" href="wireframe-caja.html"><span class="fkey">F1</span><span class="fdot">·</span><span class="flabel">Caja</span></a>
  <div class="funcbar-sep"></div>
  <a class="funcbar-item" href="wireframe-clientes.html"><span class="fkey">F4</span><span class="fdot">·</span><span class="flabel">Clientes</span></a>
  <div class="funcbar-sep"></div>
  <a class="funcbar-item" href="wireframe-cotizaciones.html"><span class="fkey">F6</span><span class="fdot">·</span><span class="flabel">Cotizaciones</span></a>
  <div class="funcbar-sep"></div>
  <a class="funcbar-item" href="wireframe-facturas.html"><span class="fkey">F8</span><span class="fdot">·</span><span class="flabel">Facturas</span></a>
  <div class="funcbar-sep"></div>
  <a class="funcbar-item active" href="wireframe-configuracion.html"><span class="fkey">ADM</span><span class="fdot">·</span><span class="flabel">Admin</span></a>
</nav>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:68px;right:24px;background:#18181B;color:white;border-radius:6px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;min-width:260px;opacity:0;transform:translateY(8px);transition:opacity 200ms,transform 200ms;pointer-events:none;z-index:999;">
  <div id="toast-icon" style="width:18px;height:18px;border-radius:50%;background:var(--success);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;">✓</div>
  <span id="toast-msg" style="flex:1;"></span>
</div>

<script>
/* ── Clock ── */
function updateClock(){const n=new Date();document.getElementById('clock').textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;}
updateClock();setInterval(updateClock,1000);

/* ── Data ── */
const PRODUCTS = [
  {id:1,name:'Ibuprofeno 400mg · Caja x10',stock:48,min:10,cat:'Medicamentos'},
  {id:2,name:'Crema Cicatrizante 50g',stock:4,min:5,cat:'Cosméticos'},
  {id:3,name:'Guantes Latex M x100',stock:22,min:10,cat:'Insumos'},
  {id:4,name:'Suero Fisiológico 500ml',stock:0,min:20,cat:'Medicamentos'},
  {id:5,name:'Bisturí Desechable #22',stock:150,min:50,cat:'Insumos'},
  {id:6,name:'Alcohol 70% 500ml',stock:3,min:8,cat:'Medicamentos'},
  {id:7,name:'Gel Antibacterial 250ml',stock:28,min:15,cat:'Cuidado'},
  {id:8,name:'Vendas Elásticas 4"',stock:0,min:30,cat:'Insumos'},
];

const MOVEMENTS = [
  {id:1,prod:'Ibuprofeno 400mg',type:'entrada',delta:+50,stock:48,reason:'Conteo físico',user:'Admin',time:'10:15'},
  {id:2,prod:'Crema Cicatrizante 50g',type:'salida',delta:-1,stock:4,reason:'Venta #1082',user:'Sistema',time:'09:45'},
  {id:3,prod:'Guantes Latex M x100',type:'ajuste',delta:-3,stock:22,reason:'Producto dañado',user:'Admin',time:'09:20'},
  {id:4,prod:'Suero Fisiológico 500ml',type:'salida',delta:-1,stock:0,reason:'Venta #1079',user:'Sistema',time:'08:55'},
  {id:5,prod:'Bisturí Desechable #22',type:'entrada',delta:+100,stock:150,reason:'Compra #CP-042',user:'Admin',time:'08:30'},
  {id:6,prod:'Alcohol 70% 500ml',type:'salida',delta:-2,stock:3,reason:'Venta #1070',user:'Sistema',time:'08:10'},
];

/* ── Status helpers ── */
function getStatus(s,m){if(s===0)return'out';if(s<m)return'low';return'ok';}
function statusChip(s,m){const st=getStatus(s,m);if(st==='out')return'<span class="chip chip-error">Sin stock</span>';if(st==='low')return'<span class="chip chip-warning">Stock bajo</span>';return'<span class="chip chip-success">En stock</span>';}
function barColor(s,m){if(s===0)return'var(--error)';if(s<m)return'var(--warning)';return'var(--success)';}
function barWidth(s,m){if(m===0)return'100%';const pct=Math.min((s/Math.max(s*1.5,m*2))*100,100);return pct+'%';}

/* ── Render inventory ── */
let selectedId=null;
function renderInv(filter='',statusFilter=''){
  const list=document.getElementById('inv-list');
  let data=PRODUCTS.filter(p=>{
    const matchQ=p.name.toLowerCase().includes(filter.toLowerCase());
    const matchS=!statusFilter||getStatus(p.stock,p.min)===statusFilter;
    return matchQ&&matchS;
  });
  list.innerHTML=data.map((p,i)=>`
    <div class="dg-row ${i%2===0?'alt':''} ${selectedId===p.id?'selected':''}" onclick="selectProd(${p.id})">
      <div class="dg-cell" style="flex:1;font-weight:500;">${p.name}</div>
      <div class="dg-cell" style="width:100px;">
        <div class="stock-bar-wrap">
          <span class="mono" style="font-size:12px;font-weight:600;min-width:24px;">${p.stock}</span>
          <div class="stock-bar"><div class="stock-bar-fill" style="width:${barWidth(p.stock,p.min)};background:${barColor(p.stock,p.min)};"></div></div>
        </div>
      </div>
      <div class="dg-cell" style="width:90px;">${statusChip(p.stock,p.min)}</div>
      <div class="dg-cell row-actions" style="width:40px;">
        <button class="btn-icon" onclick="event.stopPropagation();quickAdj(${p.id})" title="Ajustar"><span class="material-symbols-outlined">tune</span></button>
      </div>
    </div>
  `).join('');
}

function filterInv(){renderInv(document.getElementById('inv-search').value,document.getElementById('filter-status').value);}

/* ── Select product ── */
function selectProd(id){
  selectedId=id;
  const p=PRODUCTS.find(x=>x.id===id);
  document.getElementById('adj-product').value=id;
  document.getElementById('adj-product-chip').textContent=p.name;
  document.getElementById('adj-product-chip').className='chip chip-primary';
  updateAdjPreview();
  renderInv(document.getElementById('inv-search').value,document.getElementById('filter-status').value);
}

function quickAdj(id){selectProd(id);document.getElementById('adj-qty')?.focus();}

/* ── Sign toggle ── */
let positive=true;
function toggleSign(){
  positive=!positive;
  const el=document.getElementById('delta-sign');
  el.textContent=positive?'+':'−';
  el.className=positive?'delta-sign positive':'delta-sign negative';
  updateAdjPreview();
}

/* ── Adj preview ── */
function onAdjProductChange(){
  const id=parseInt(document.getElementById('adj-product').value);
  if(!id){document.getElementById('adj-preview').style.display='none';return;}
  selectedId=id;
  const p=PRODUCTS.find(x=>x.id===id);
  document.getElementById('adj-product-chip').textContent=p.name;
  document.getElementById('adj-product-chip').className='chip chip-primary';
  updateAdjPreview();
}

function updateAdjPreview(){
  const id=parseInt(document.getElementById('adj-product').value);
  if(!id){document.getElementById('adj-preview').style.display='none';return;}
  const p=PRODUCTS.find(x=>x.id===id);
  const qty=parseInt(document.getElementById('delta-qty').value)||0;
  const delta=positive?qty:-qty;
  const newStock=Math.max(0,p.stock+delta);
  const preview=document.getElementById('adj-preview');
  preview.style.display='block';
  document.getElementById('adj-current').textContent=p.stock;
  const newEl=document.getElementById('adj-new');
  newEl.textContent=newStock;
  newEl.style.color=newStock<p.min?'var(--error)':'var(--success)';
}

function applyAdj(){
  const id=parseInt(document.getElementById('adj-product').value);
  if(!id){showToast('error','Selecciona un producto');return;}
  const reason=document.getElementById('adj-reason').value;
  if(!reason){showToast('error','Selecciona un motivo');return;}
  showToast('success','Ajuste aplicado correctamente');
  clearAdj();
}

function clearAdj(){
  document.getElementById('adj-product').value='';
  document.getElementById('delta-qty').value=1;
  document.getElementById('adj-reason').value='';
  document.getElementById('adj-note').value='';
  document.getElementById('adj-preview').style.display='none';
  document.getElementById('adj-product-chip').textContent='Selecciona un producto';
  document.getElementById('adj-product-chip').className='chip chip-neutral';
  positive=true;
  const el=document.getElementById('delta-sign');
  el.textContent='+';el.className='delta-sign positive';
  selectedId=null;
  renderInv();
}

/* ── Movements ── */
const MV_ICONS={entrada:'arrow_downward',salida:'arrow_upward',ajuste:'swap_vert'};
function renderMovements(){
  const list=document.getElementById('mv-list');
  const f=document.getElementById('mv-filter').value;
  const data=f?MOVEMENTS.filter(m=>m.type===f):MOVEMENTS;
  if(!data.length){list.innerHTML='<div style="padding:40px;text-align:center;color:var(--on-surface-muted);font-size:13px;">Sin movimientos</div>';return;}
  list.innerHTML=data.map(m=>`
    <div class="mv-row">
      <div class="mv-icon ${m.type}"><span class="material-symbols-outlined">${MV_ICONS[m.type]}</span></div>
      <div class="mv-info">
        <div class="mv-prod">${m.prod}</div>
        <div class="mv-meta">${m.reason} · ${m.user} · ${m.time} → stock: ${m.stock}</div>
      </div>
      <div class="mv-delta ${m.delta>0?'pos':'neg'}">${m.delta>0?'+':''}${m.delta}</div>
    </div>
  `).join('');
}
document.getElementById('mv-filter').addEventListener('change',renderMovements);

/* ── Toast ── */
function showToast(type,msg){
  const t=document.getElementById('toast'),i=document.getElementById('toast-icon'),m=document.getElementById('toast-msg');
  const c={success:{bg:'var(--success)',text:'✓'},error:{bg:'var(--error)',text:'✕'},info:{bg:'var(--primary)',text:'i'}}[type]||{bg:'var(--primary)',text:'i'};
  i.style.background=c.bg;i.textContent=c.text;m.textContent=msg;
  t.style.opacity='1';t.style.transform='translateY(0)';
  clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(8px)';},3000);
}

function exportCsv(){showToast('info','CSV exportado al escritorio');}

/* ── Init ── */
renderInv();
renderMovements();
</script>
</body>
</html>
